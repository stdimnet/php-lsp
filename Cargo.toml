[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stdimnet/php-lsp"
rust-version = "1.80"

[workspace.dependencies]
php-syntax = { path = "crates/php-syntax" }
php-ide = { path = "crates/php-ide" }
php-hir = { path = "crates/php-hir" }
php-index = { path = "crates/php-index" }
php-stubs = { path = "crates/php-stubs" }
php-fmt = { path = "crates/php-fmt" }
rayon = "1"
walkdir = "2"
globset = "0.4"
miniz_oxide = "0.8"
rowan = "0.17"
lsp-server = "0.10"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
expect-test = "1"
crossbeam-channel = "0.5"

[profile.release]
debug = false
lto = "thin"
